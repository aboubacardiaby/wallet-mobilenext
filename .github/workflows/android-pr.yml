name: Android PR Build

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'app.json'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build & Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_API_URL=https://kalipeh-wallet-525776555218.us-central1.run.app/api/v1/" > .env

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.event.pull_request.number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Add PR comment with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Android Build Successful

              Debug APK has been built and uploaded as an artifact.

              **Download:** Go to the [Actions tab](${context.payload.repository.html_url}/actions/runs/${context.runId}) → Artifacts → debug-apk-${{ github.event.pull_request.number }}

              _Build triggered by commit ${context.sha.substring(0, 7)}_`
            })
