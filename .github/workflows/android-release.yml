name: Android Build & Deploy to Google Play

on:
  push:
    branches:
      - feature-temp
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'app.json'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      skip_build:
        description: 'Skip build and use existing artifact'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  RUBY_VERSION: '3.2'

jobs:
  # Job 1: Run tests and lint checks
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  # Job 2: Build Android App Bundle (AAB)
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip_build }}
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.API_URL }}" > .env

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          cat > android/app/keystore.properties << EOF
          WALLET_UPLOAD_STORE_FILE=release.keystore
          WALLET_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          WALLET_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          WALLET_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build Release APK (optional)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # Job 3: Deploy to Google Play
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.track || 'internal' }}
      url: https://play.google.com/console
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: android

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/

      - name: Create Google Play Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > android/google-play-service-account.json

      - name: Install Fastlane
        working-directory: android
        run: |
          gem install bundler
          bundle install

      - name: Deploy to Google Play
        working-directory: android
        env:
          SUPPLY_JSON_KEY: google-play-service-account.json
          SUPPLY_PACKAGE_NAME: com.kalipeh.mobile
          SUPPLY_TRACK: ${{ github.event.inputs.track || 'internal' }}
          SUPPLY_AAB: app/build/outputs/bundle/release/app-release.aab
        run: |
          bundle exec fastlane deploy track:$SUPPLY_TRACK

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/google-play-service-account.json
          rm -f android/app/keystore.properties
          rm -f android/app/release.keystore

  # Job 4: Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            Android build ${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})
            Deployed to: ${{ github.event.inputs.track || 'internal' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
